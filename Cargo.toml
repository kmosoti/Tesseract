[workspace]
members = ["crates/contracts", "crates/kernel", "crates/journal", "crates/workshop", "crates/lab", "crates/si", "xtask"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kmosoti/tesseract"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
thiserror = "2.0"
sha2 = "0.10"
rand = "0.8"
rand_chacha = "0.3"
nalgebra = { version = "0.33", features = ["serde-serialize"] }
num-complex = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
tempfile = "3.14"
tesseract-contracts = { path = "crates/contracts" }
tesseract-kernel = { path = "crates/kernel" }
tesseract-journal = { path = "crates/journal" }
tesseract-workshop = { path = "crates/workshop" }

[profile.release]
debug = 1

[workspace.lints.rust]
unsafe_code = "forbid"
