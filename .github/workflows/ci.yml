name: CI
on:
  push:
    branches: [develop]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust
        run: rustup toolchain install beta-2026-10-18 --profile minimal --component rustfmt --component clippy
      - name: Install formal tools
        run: |
          sudo apt-get update
          sudo apt-get install -y z3
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/v4.1.2/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: cargo xtask knowledge
      - run: cargo build --locked --release --workspace
      - name: Run diagnostic comparison
        run: cargo run --locked --release -p tesseract-lab -- compare --tier smoke --workers 2 --out runs/ci-smoke.json
      - name: Check Lean semantics
        run: cargo xtask formal
