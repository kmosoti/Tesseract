name: CI
on:
  push:
    branches: [develop]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install pinned Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: python3 scripts/validate_knowledge.py
      - run: cargo build --locked --release --workspace
      - name: Run diagnostic comparison
        run: cargo run --locked --release -p tesseract-lab -- compare --tier smoke --workers 2 --out runs/ci-smoke.json
